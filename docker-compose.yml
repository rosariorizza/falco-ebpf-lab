services:
  falco:
    image: falcosecurity/falco:0.44.1
    container_name: falco-ebpf-lab
    privileged: true
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./falco/ebpf-safety-rules.yaml:/etc/falco/rules.d/ebpf-safety-rules.yaml:ro
    command:
      - /usr/bin/falco
      - -r
      - /etc/falco/rules.d/ebpf-safety-rules.yaml
      - -o
      - engine.kind=modern_ebpf
      - -o
      - stdout_output.enabled=true
      - -o
      - syslog_output.enabled=false
      - -o
      - json_output=false
      - -o
      - buffered_outputs=false
      - -o
      - rule_matching=all

  tester:
    build:
      context: .
      dockerfile: tester/Dockerfile
    container_name: falco-ebpf-tester
    user: "10001:10001"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - seccomp=./tester/seccomp-profile.json
    read_only: true
    depends_on:
      - falco
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /run/cilium/bpffs:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=10001,gid=10001
    volumes:
      - ./tests:/tests:ro
    command: ["setpriv", "--no-new-privs", "sleep", "infinity"]
